name: RentNest CI Pipeline

on:
  push:
    branches: [ main, testing, dev ]
  pull_request:
    branches: [ main, testing, dev ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    # 1. NEW: Spin up a temporary PostgreSQL database using Docker
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: rentnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Dependencies
        run: |
          npm --prefix client install --include=dev
          npm --prefix server install --include=dev

      # 2. NEW (DevSecOps): Run a quick security audit on dependencies
      - name: Security Vulnerability Scan (SAST)
        run: |
          npm --prefix server audit --audit-level=high || echo "High vulnerabilities found! Check logs."
          npm --prefix client audit --audit-level=high || echo "High vulnerabilities found! Check logs."

      - name: Verify Client Build (React + Vite + TypeScript)
        run: npm --prefix client run build

      - name: Verify Server Build (Node + TypeScript)
        run: npm --prefix server run build

      - name: Run Automated API & Security Tests
        # 3. NEW: Pass the local Docker database URL to the server for testing
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/rentnest_test
          JWT_SECRET: test_secret_for_ci_only
        run: |
          # Seed demo data for test environment
          AUTO_SEED=true PORT=5000 node server/dist/index.js &
          
          # Wait for server to start
          sleep 4
          
          # Execute test suite
          npx ts-node server/test-api.ts
